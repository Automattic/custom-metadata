version: 2

updates:
  # GitHub Actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Actions"
      include: "scope"
    open-pull-requests-limit: 5

  # Composer (development tooling, plus the composer/installers plugin).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "Composer"
      include: "scope"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
