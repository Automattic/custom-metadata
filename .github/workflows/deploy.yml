name: Deploy to WordPress.org

on:
  # Trigger on a version tag push rather than the `release: released` event.
  # Releases created by the default GITHUB_TOKEN do not raise `release` events,
  # so a `release`-triggered deploy would never run after the automated release.
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

# Disable all permissions by default; grant minimal permissions per job.
permissions: {}

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: WordPress.org plugin deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SLUG: custom-metadata
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
