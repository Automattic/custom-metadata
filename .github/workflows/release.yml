name: Create GitHub Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

# Disable all permissions by default; grant minimal permissions per job.
permissions: {}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create distribution ZIP
        run: |
          PLUGIN_SLUG="custom-metadata"
          mkdir -p "/tmp/dist/${PLUGIN_SLUG}"

          # Copy files, respecting .distignore.
          rsync -rc --exclude-from=".distignore" ./ "/tmp/dist/${PLUGIN_SLUG}/"

          # Create a ZIP with a single top-level plugin directory.
          cd /tmp/dist
          zip -r "/tmp/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: /tmp/*.zip
          generate_release_notes: true
          draft: false
