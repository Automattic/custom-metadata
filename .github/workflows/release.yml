name: Create GitHub Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

# Disable all permissions by default; grant minimal permissions per job.
permissions: {}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create distribution ZIP
        run: |
          PLUGIN_SLUG="custom-metadata"
          mkdir -p "/tmp/dist/${PLUGIN_SLUG}"

          # Copy files, respecting .distignore.
          rsync -rc --exclude-from=".distignore" ./ "/tmp/dist/${PLUGIN_SLUG}/"

          # Create a ZIP with a single top-level plugin directory.
          cd /tmp/dist
          zip -r "/tmp/${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Prepare release title and notes
        id: prep
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -u

          # Strip an optional leading "v" from the tag (v1.2.3 -> 1.2.3).
          VERSION="${VERSION#v}"

          # Title: "<Plugin Name> <version>" (e.g. "Custom Metadata Manager 1.2.3").
          # The plugin name is read from the "Plugin Name:" header of the main plugin
          # file, so the title carries context wherever the release is surfaced
          # (Slack, email notifications, and so on) rather than a bare version number.
          PLUGIN_NAME="$(grep -h 'Plugin Name:' -- *.php | head -n1 | sed -E 's/.*Plugin Name:[[:space:]]*//; s/[[:space:]]*$//')"
          echo "title=${PLUGIN_NAME} ${VERSION}" >> "$GITHUB_OUTPUT"

          # Notes: the CHANGELOG entry for this version, with the top
          # "## [x.y.z] - date" heading dropped (the title already conveys it) and the
          # "###" subsections promoted to "##" so they render as top-level sections.
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[?" ver "(\\]| |$)") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -E 's/^### /## /' > notes.raw

          # Trim leading and trailing blank lines.
          awk 'NF { seen = 1 } seen' notes.raw | tac | awk 'NF { seen = 1 } seen' | tac > notes.md

          if [ -s notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG entry found for ${VERSION}; falling back to auto-generated notes."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Title with the plugin name, and body from the CHANGELOG when available;
          # otherwise fall back to GitHub's auto-generated notes.
          name: ${{ steps.prep.outputs.title }}
          body_path: ${{ steps.prep.outputs.have_notes == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.prep.outputs.have_notes != 'true' }}
          files: /tmp/*.zip
          draft: false
